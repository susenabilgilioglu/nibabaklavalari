        Harika bir düşünce! Domain ve sunucu yönlendirmesini test etmek için kullanabileceğiniz, şık ve modern görünümlü, mobil uyumlu tek sayfalık HTML kodunu aşağıda bulabilirsiniz.

Dosyayı **`index.html`** adıyla kaydedip sunucunuza (ana dizine) yüklemeniz yeterlidir.

```html
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yakında Hizmete Açılacağız</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #111827; /* Şık koyu arka plan */
            color: #f9fafb;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: rgba(31, 41, 55, 0.8);
            border: 1px solid rgba(217, 119, 6, 0.3); /* Tatlı/baklava temasına uygun altın/kehribar tonu border */
            padding: 48px 32px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            max-width: 480px;
            width: 100%;
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: #f59e0b; /* Sıcak baklava/altın sarısı tonu */
            margin-bottom: 12px;
            line-height: 1.3;
        }

        p {
            color: #9ca3af;
            font-size: 1rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">✨</div>
        <h1>Yakında Hizmete Açılacağız</h1>
        <p>Web sitemiz en kısa sürede lezzetli sunumuyla sizlerle olacaktır.</p>
    </div>

</body>
</html>
